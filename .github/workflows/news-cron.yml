name: News + analysis cron

on:
  workflow_dispatch: {}

concurrency:
  group: news-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Hit /api/cron/news
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "CRON_URL / CRON_SECRET secret not set — skipping cron run."
            exit 0
          fi
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          status="$(curl -sS --max-time 280 \
            -o "${response_file}" \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_URL}")"

          cat "${response_file}"
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::Cron endpoint returned HTTP ${status}; expected 200."
            exit 1
          fi

          if ! jq -e '
            .ok == true
            and (.cursor | type == "object")
            and (.news.loaded | type == "array")
            and (.news.failed | type == "array")
            and (.analysis | type == "array")
            and (.breakers | type == "object")
          ' "${response_file}" >/dev/null; then
            echo "::error::Cron endpoint returned an invalid run report."
            exit 1
          fi
