name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No secrets are provided, so config.ts leaves every has* gate false and
      # the suite runs against mocked providers — the same path tests/no-live-keys.ts
      # enforces locally.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
